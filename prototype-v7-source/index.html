<meta name="referrer" content="no-referrer" />
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  /* screen skeleton */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#FCFBF8;
  --bg-2:#F5F3EE;
  --ink:#071A31;
  --ink-2:#0E396A;
  --brand:#6BB1FF;
  --bar:#84C1FF;
  --ui-blue:#C1DEFE;
  --body:#5F6D77;
  --grey-bg:#E4E6E9;
  --line:#D8DCE0;
  --fit-bg:#F2F8DE;
  --violet:#D4C2FF;
  --cyan:#BAF0EC;
  --on-dark:#FCFBF8;

  --ok-ink:#2F6B2B;    --ok-bg:#F2F8DE;    --ok-line:#CFE0A8;
  --miss-ink:#0E396A;  --miss-bg:#E8EEF5;  --miss-line:#C7D6E6;
  --ask-ink:#8A5A00;   --ask-bg:#FDF3DC;   --ask-line:#EBD6A6;
  --no-ink:#9B3B33;    --no-bg:#FBEAE7;    --no-line:#EFC9C2;
  --note-ink:#0E396A;  --note-bg:#C1DEFE;

  --hero:linear-gradient(135deg,#315A9D 0%,#4F8DDE 55%,#C5A8F5 100%);

  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-2xl:40px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(7,26,49,.06);
  --sh-2:0 8px 24px rgba(7,26,49,.08);
  --sh-3:0 20px 48px rgba(7,26,49,.12);
  --dur-fb:240ms; --dur-q:340ms; --dur-page:460ms;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --pad:24px;
  --maxw:1200px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:16px; line-height:1.6; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#main:focus{outline:none;}
img{max-width:100%;}
h1,h2,h3,h4,p,dl,dd,dt,figure{margin:0;}
ul,ol{margin:0;padding:0;list-style:none;}
a{color:var(--ink-2);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid #2F6DBF;outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip{position:absolute;left:8px;top:-60px;z-index:99;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;transition:top 160ms;}
.skip:focus{top:8px;}

/* ============ 排版 ============ */
.t-eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--body);}
.t-h1{font-size:clamp(38px,5.2vw,56px);line-height:1.14;font-weight:700;letter-spacing:-.01em;}
.t-h2{font-size:clamp(24px,2.6vw,32px);line-height:1.25;font-weight:700;}
.t-h3{font-size:20px;line-height:1.35;font-weight:600;}
.t-h4{font-size:17px;line-height:1.4;font-weight:600;}
.t-body{font-size:16px;color:var(--body);}
.t-sm{font-size:14px;color:var(--body);}
.t-xs{font-size:13px;color:var(--body);}
.t-num{font-size:clamp(28px,3vw,40px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;}
.ink{color:var(--ink);} .muted{color:var(--body);} .strong{font-weight:600;}
.serif{font-family:var(--font-serif);}

/* ============ 外壳 ============ */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad);}
.page{padding-block:40px 72px;animation:pg var(--dur-page) var(--ease) both;}
@keyframes pg{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* 公告栏 */
.topbar{position:relative;background:var(--bar);color:#071A31;}
.topbar__in{min-height:40px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:6px calc(var(--pad) + 44px);font-size:14px;text-align:center;}
.topbar a{color:#071A31;text-decoration:underline;text-underline-offset:3px;font-weight:600;}
.topbar__close{position:absolute;right:max(8px,calc((100vw - var(--maxw))/2));top:50%;transform:translateY(-50%);display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:transparent;cursor:pointer;}
.topbar__close:hover{background:rgba(255,255,255,.28);}

/* 导航 */
.nav{position:sticky;top:0;z-index:40;background:rgba(252,251,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav__in{display:flex;align-items:center;gap:16px;min-height:68px;padding-inline:var(--pad);max-width:var(--maxw);margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;flex:none;}
.brand:hover{text-decoration:none;}
.brand__mark{width:36px;height:36px;border-radius:11px;background:var(--hero);display:grid;place-items:center;color:#fff;flex:none;}
.brand__txt{display:grid;gap:1px;}
.brand__name{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2;}
.brand__sub{font-size:12px;color:var(--body);line-height:1.2;}
.nav__mid{display:flex;align-items:center;gap:4px;margin-left:12px;}
.nav__mid a,.nav__mid button{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:0;background:none;border-radius:var(--r-sm);font-size:15px;color:var(--ink);cursor:pointer;}
.nav__mid a:hover,.nav__mid button:hover{background:var(--bg-2);text-decoration:none;}
.nav__mid a[aria-current="page"]{background:var(--ui-blue);font-weight:600;}
.nav__end{margin-left:auto;display:flex;align-items:center;gap:8px;}
.iconbtn.nav__burger{display:none;}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--bg-2);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:background 160ms,border-color 160ms,transform 160ms;text-align:center;}
.btn:hover{text-decoration:none;}
.btn--primary{background:var(--ink-2);color:#fff;box-shadow:var(--sh-1);}
.btn--primary:hover{background:#0b2e56;transform:translateY(-1px);box-shadow:var(--sh-2);}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn--ghost:hover{background:var(--bg-2);transform:translateY(-1px);box-shadow:var(--sh-1);}
.btn--quiet{background:transparent;color:var(--ink-2);padding-inline:10px;font-weight:500;text-decoration:underline;text-underline-offset:3px;}
.btn--onhero{background:#fff;color:#071A31;}
.btn--onhero:hover{background:#f0f4fb;}
.btn--sm{min-height:40px;padding:8px 14px;font-size:14px;}
.btn--block{width:100%;}
.btn--danger{background:var(--no-bg);color:var(--no-ink);border-color:var(--no-line);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn:not([disabled]):active{transform:translateY(0);}
.btn__ico{flex:none;display:grid;place-items:center;}

/* 卡片 */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);}
.card--flat{box-shadow:none;}
.card--tint{background:var(--bg-2);border-color:#E7E3DA;}
.card__b{padding:24px;}
.card__b--tight{padding:18px;}
.hr{height:1px;background:var(--line);border:0;margin:0;}

/* 徽标 / 状态 */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:5px 11px;font-size:13px;font-weight:600;background:var(--bg-2);color:var(--ink);border:1px solid var(--line);}
.chip--plain{background:#fff;}
.chip--demo{background:var(--violet);border-color:#C3ADF7;color:#3A2A6B;}
.chip--note{background:var(--note-bg);border-color:#A9CEF8;color:var(--note-ink);}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-pill);padding:6px 13px;font-size:14px;font-weight:600;border:1px solid;}
.v-ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);}
.v-missing{background:var(--miss-bg);color:var(--miss-ink);border-color:var(--miss-line);}
.v-ask{background:var(--ask-bg);color:var(--ask-ink);border-color:var(--ask-line);}
.v-no{background:var(--no-bg);color:var(--no-ink);border-color:var(--no-line);}
.v-closed{background:var(--grey-bg);color:#4A535A;border-color:var(--line);}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}

/* 表单 */
.label{font-size:14px;font-weight:600;color:var(--ink);}
.hint{font-size:13px;color:var(--body);}
.input,.select,.textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font:inherit;color:var(--ink);}
.textarea{min-height:96px;resize:vertical;}
.input:focus,.select:focus,.textarea:focus{border-color:#2F6DBF;outline:none;box-shadow:0 0 0 3px rgba(47,109,191,.16);}
.err{font-size:13px;color:var(--no-ink);font-weight:600;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;cursor:pointer;min-height:56px;transition:border-color 160ms,background 160ms;}
.opt:hover{border-color:#9EC4EE;background:#FAFCFF;}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:#2F6DBF;background:var(--ui-blue);}
.opt__box{width:22px;height:22px;border-radius:7px;border:1.75px solid #9AA6AE;flex:none;display:grid;place-items:center;background:#fff;margin-top:2px;}
.opt[aria-pressed="true"] .opt__box,.opt[aria-checked="true"] .opt__box{border-color:var(--ink-2);background:var(--ink-2);color:#fff;}
.opt--radio .opt__box{border-radius:50%;}
.opt__t{font-weight:600;}
.opt__d{font-size:13px;color:var(--body);}

/* 进度 */
.prog{display:grid;gap:8px;}
.prog__bar{height:4px;border-radius:999px;background:var(--grey-bg);overflow:hidden;}
.prog__fill{height:100%;background:var(--ink-2);border-radius:999px;transition:width var(--dur-q) var(--ease);}

/* Hero */
.hero{border-radius:var(--r-2xl);background:var(--hero);color:var(--on-dark);padding:56px;position:relative;overflow:hidden;}
.hero__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;align-items:start;}
.hero__eyebrow{font-size:13px;letter-spacing:.14em;color:rgba(252,251,248,.86);}
.hero h1{font-size:clamp(38px,4.6vw,54px);line-height:1.16;font-weight:700;margin-top:14px;letter-spacing:-.01em;}
.hero__p{margin-top:16px;font-size:17px;line-height:1.65;color:rgba(252,251,248,.92);max-width:30em;}
.hero__safe{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;}
.hero__safe span{font-size:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);border-radius:var(--r-pill);padding:5px 12px;}
.panel{background:#fff;color:var(--ink);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-3);}
.hero-question{align-self:start;}
.region-picker--hero{--od-gap:10px!important;}
.region-picker--hero #rg-help{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.region-picker--hero [data-res]{max-height:88px;overflow:auto;overscroll-behavior:contain;}
.region-picker--hero [data-picked]{max-height:112px;overflow:auto;overscroll-behavior:contain;}

/* 反馈区（固定高度，避免跳动） */
.fb{min-height:60px;display:flex;align-items:center;}
.fb__in{display:flex;align-items:center;gap:10px;background:var(--note-bg);color:var(--note-ink);border:1px solid #A9CEF8;border-radius:var(--r-md);padding:11px 14px;font-size:14px;font-weight:600;animation:fbin var(--dur-fb) var(--ease) both;}
.fb__in--done{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line);}
.step-saved{display:flex;align-items:flex-start;gap:10px;background:var(--ok-bg);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:var(--r-md);padding:12px 14px;font-size:14px;font-weight:600;animation:fbin var(--dur-fb) var(--ease) both;}
@keyframes fbin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* 报考工作台与计划 */
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
.journey__i{display:grid;gap:7px;align-content:start;min-height:82px;padding:12px;border-radius:var(--r-md);background:var(--bg-2);border:1px solid transparent;color:var(--body);font-size:13px;}
.journey__i::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);}
.journey__i--done{background:var(--fit-bg);color:var(--ok-ink);}
.journey__i--done::before{background:var(--ok-ink);}
.journey__i--now{background:var(--ui-blue);border-color:#8EBEF1;color:var(--ink-2);font-weight:600;}
.journey__i--now::before{background:var(--ink-2);box-shadow:0 0 0 4px rgba(14,57,106,.12);}
.task{display:flex;align-items:flex-start;gap:12px;width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;text-align:left;cursor:pointer;}
.task:hover{border-color:#9EC4EE;background:#FAFCFF;}
.task[aria-pressed="true"]{background:var(--fit-bg);border-color:var(--ok-line);}
.task__check{display:grid;place-items:center;flex:none;width:24px;height:24px;border:1.5px solid #9AA6AE;border-radius:8px;color:transparent;background:#fff;margin-top:1px;}
.task[aria-pressed="true"] .task__check{background:var(--ok-ink);border-color:var(--ok-ink);color:#fff;}
.metric{display:grid;gap:5px;padding:18px;background:var(--bg-2);border-radius:var(--r-md);}
.metric__v{font-size:26px;line-height:1.15;font-weight:700;color:var(--ink);}
.workspace-hero{background:linear-gradient(135deg,#EAF3FE 0%,#F5F3EE 58%,#EEE7FC 100%);border:1px solid #D7E2EF;border-radius:var(--r-xl);padding:30px;}

/* 机会卡 */
.opp{display:grid;gap:14px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);}
.opp--hi{border-color:#A9CEF8;box-shadow:var(--sh-2);}
.opp__t{font-size:18px;font-weight:700;line-height:1.4;}
.opp__meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--body);}
.opp__meta i{font-style:normal;color:var(--line);}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.fact dt{font-size:12px;color:var(--body);}
.fact dd{font-size:15px;font-weight:600;color:var(--ink);margin:2px 0 0;}
.why{background:var(--bg-2);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--ink);}

/* 分组 */
.group{display:grid;gap:16px;}
.group__h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.group__c{font-size:13px;color:var(--body);}

/* 折叠 */
.acc{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;overflow:hidden;}
.acc+.acc{margin-top:10px;}
.acc__btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left;min-height:56px;}
.acc__btn:hover{background:#FAFCFF;}
.acc__t{font-weight:600;flex:1 1 0;min-width:0;}
.acc__p{padding:0 16px 18px;display:grid;gap:12px;}
.caret{transition:transform 200ms var(--ease);flex:none;color:var(--body);}
.acc__btn[aria-expanded="true"] .caret{transform:rotate(180deg);}

/* 依据表 */
.ev{display:grid;gap:10px;}
.ev__row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 14px;font-size:14px;}
.ev__k{color:var(--body);}
.ev__v{color:var(--ink);}
.src{background:var(--bg-2);border-left:3px solid var(--brand);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px;font-family:var(--font-serif);font-size:14px;color:var(--ink);}

/* 时间线 */
.tl{display:grid;gap:0;}
.tl__i{display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative;}
.tl__i:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--line);}
.tl__d{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;z-index:1;}
.tl__d--done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink);}
.tl__d--now{background:var(--note-bg);border-color:#7FB5F0;color:var(--note-ink);}
.tl__t{font-weight:600;font-size:15px;}
.tl__s{font-size:13px;color:var(--body);}

/* 弹窗 / 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(7,26,49,.46);z-index:60;display:grid;place-items:center;padding:16px;animation:fade 200ms var(--ease) both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:#fff;border-radius:var(--r-xl);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-3);animation:mup var(--dur-fb) var(--ease) both;}
@keyframes mup{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.modal__h{padding:24px 24px 0;display:flex;align-items:flex-start;gap:12px;}
.modal__b{padding:16px 24px 24px;display:grid;gap:16px;}
.drawer-scrim{align-items:stretch;justify-items:end;padding:0;}
.drawer{background:#fff;width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--sh-3);animation:dr var(--dur-page) var(--ease) both;}
@keyframes dr{from{transform:translateX(24px);opacity:.6;}to{transform:none;opacity:1;}}
.drawer__h{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;gap:12px;z-index:1;}
.drawer__b{padding:24px;display:grid;gap:18px;}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:pointer;flex:none;}
.iconbtn:hover{background:var(--bg-2);}

/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;display:grid;gap:8px;width:min(440px,calc(100% - 32px));}
.toast{background:var(--ink);color:var(--on-dark);border-radius:var(--r-md);padding:13px 16px;font-size:14px;box-shadow:var(--sh-3);animation:tin var(--dur-fb) var(--ease) both;}
@keyframes tin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{min-height:48px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-size:15px;color:var(--body);white-space:nowrap;}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink-2);font-weight:600;}

/* 骨架 */
.sk{background:linear-gradient(90deg,#EFEDE7 25%,#F7F6F2 37%,#EFEDE7 63%);background-size:400% 100%;animation:skm 1.4s ease-in-out infinite;border-radius:8px;}
@keyframes skm{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.sk--t{height:14px;} .sk--h{height:22px;} .sk--card{height:150px;border-radius:var(--r-lg);}

/* 状态块 */
.state{display:grid;gap:14px;justify-items:start;padding:32px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;}
.state__i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--bg-2);color:var(--ink-2);}
.callout{display:grid;gap:8px;border-radius:var(--r-md);padding:16px;border:1px solid;}
.callout--ask{background:var(--ask-bg);border-color:var(--ask-line);color:#6B4600;}
.callout--no{background:var(--no-bg);border-color:var(--no-line);color:#7E2F28;}
.callout--note{background:#EAF3FE;border-color:#A9CEF8;color:var(--note-ink);}
.callout--ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink);}
.callout--grey{background:var(--bg-2);border-color:var(--line);color:var(--ink);}

/* 底部主行动栏（移动端） */
.actionbar{display:none;}
/* 底部导航（登录后，移动端） */
.tabbar{display:none;}

/* Footer */
.foot{background:var(--ink);color:var(--on-dark);border-radius:var(--r-2xl) var(--r-2xl) 0 0;margin-top:72px;}
.foot__in{padding:48px var(--pad) 40px;max-width:var(--maxw);margin:0 auto;display:grid;gap:32px;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));}
.foot a{color:rgba(252,251,248,.82);}
.foot h4{font-size:14px;letter-spacing:.08em;color:rgba(252,251,248,.6);text-transform:uppercase;margin-bottom:12px;}
.foot__links{display:grid;gap:10px;font-size:14px;}
.foot__bot{border-top:1px solid rgba(252,251,248,.16);padding:18px var(--pad);max-width:var(--maxw);margin:0 auto;font-size:13px;color:rgba(252,251,248,.66);display:flex;flex-wrap:wrap;gap:8px 20px;}

/* 后台 */
.console{background:#F7F8F9;min-height:100vh;}
.console .card{border-radius:var(--r-md);}
.console__h{background:#fff;border-bottom:1px solid var(--line);padding:14px var(--pad);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.ctable--scroll{overflow-x:auto;}
.ctable{width:100%;border-collapse:collapse;font-size:14px;}
.ctable th,.ctable td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
.ctable th{font-size:12px;color:var(--body);font-weight:600;background:#FAFAFB;}
.diff{display:grid;gap:4px;font-size:14px;}
.diff__o{color:var(--no-ink);text-decoration:line-through;}
.diff__n{color:var(--ok-ink);font-weight:600;}

/* ============ 响应式 ============ */
@media (max-width:1280px){
  :root{--maxw:1060px;}
  .hero{padding:44px;}
}
@media (min-width:1025px) and (max-height:820px){
  .page{padding-top:20px;}
  .hero{padding:30px 34px;}
  .hero__grid{gap:28px;}
  .hero h1{font-size:clamp(38px,4vw,48px);margin-top:10px;}
  .hero__p{margin-top:12px;line-height:1.5;}
  .hero__safe{margin-top:16px;}
  .hero-question{padding:18px;--od-gap:12px!important;}

}
@media (max-width:1024px){

  .hero h1{font-size:40px;}
  .foot__in{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .ev__row{grid-template-columns:104px minmax(0,1fr);}
  .od-grid{grid-template-columns:repeat(min(2,var(--od-cols,3)),minmax(0,1fr));}
}
@media (max-width:768px){

  .hero-question{order:-1;width:100%;}
  .hero h1{font-size:38px;}
  .hero__p{font-size:16px;}

  .page{padding-block:24px 96px;}
  .card__b{padding:18px;}
  .opp{padding:18px;}
  .ev__row{grid-template-columns:minmax(0,1fr);}
  .ev__k{font-weight:600;}
  .modal{border-radius:var(--r-lg);max-height:92vh;}
  .scrim{align-items:end;padding:0;}
  .modal{border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .drawer{width:100%;}
  .foot{border-radius:24px 24px 0 0;margin-inline:8px;}
  .foot__in{grid-template-columns:minmax(0,1fr);gap:24px;padding:32px 20px;}
  .btn--wide-m{width:100%;}
  .actionbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(252,251,248,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center;}
  .actionbar .btn{flex:1 1 0;}
  body.has-tabbar .actionbar{bottom:68px;}
  .tabbar--on{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:51;background:rgba(252,251,248,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar--on a{flex:1 1 0;display:grid;justify-items:center;gap:3px;padding:9px 0;min-height:60px;font-size:11px;color:var(--body);}
  .tabbar--on a:hover{text-decoration:none;}
  .tabbar--on a[aria-current="page"]{color:var(--ink-2);font-weight:600;}
  body.has-tabbar .toasts{bottom:82px;}
  body.has-tabbar .page{padding-bottom:110px;}
  .od-grid{grid-template-columns:minmax(0,1fr);}
  .journey{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;}
  .journey__i{min-width:132px;scroll-snap-align:start;}
  .workspace-hero{padding:22px 18px;border-radius:var(--r-lg);}
  .ctable--scroll{overflow-x:auto;}
}
@media (max-width:360px){
  :root{--pad:16px;}
  .hero h1{font-size:34px;}
  .brand__sub{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;}
}

<script id="engine">
"use strict";
/* ================= 状态与本地草稿 ================= */
var KEY = "jzyj.v1";
var S = {
  profile:{
    regions:[],              /* {n,p,tier} tier: must|prefer|ok */
    regionUndecided:false,
    edu:null, degree:null,
    major:null,
    gradYm:null, studyState:null, jobState:null,
    cert:null, certStage:null, certSubject:null, certEta:null,
    forms:[],
    extra:{}                 /* hukou / age / mandarin / work ... */
  },
  step:0,                    /* 已完成到第几步（0—6） */
  onboardingDone:false,
  resumeOffered:false,
  auth:null,                 /* {phone, at} */
  follows:{},                /* id -> {at, state, stateAt, primary, materials:{}, consults:[], plan} */
  applyMarks:{},
  notify:{change:true, deadline:true, plan:true, coverage:false, digest:false},
  corrections:[],
  seenChanges:{},
  saveFailed:false
};
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      profile:S.profile, step:S.step, onboardingDone:S.onboardingDone,
      auth:S.auth, follows:S.follows, applyMarks:S.applyMarks,
      notify:S.notify, corrections:S.corrections, seenChanges:S.seenChanges
    }));
    S.saveFailed = false; return true;
  }catch(e){ S.saveFailed = true; return false; }
}
function load(){
  try{
    var raw = localStorage.getItem(KEY); if(!raw) return false;
    var d = JSON.parse(raw);
    if(d.profile) S.profile = Object.assign(S.profile, d.profile);
    if(!S.profile.extra) S.profile.extra = {};
    S.step = d.step||0; S.onboardingDone = !!d.onboardingDone;
    S.auth = d.auth||null; S.follows = d.follows||{}; S.applyMarks = d.applyMarks||{};
    Object.keys(S.follows).forEach(function(id){ normalizeFollow(S.follows[id]); });
    S.notify = Object.assign(S.notify, d.notify||{});
    S.corrections = d.corrections||[]; S.seenChanges = d.seenChanges||{};
    return true;
  }catch(e){ return false; }
}
function clearDraft(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* 模拟保存失败：用于演示「保存失败」状态 */
var SIM = { failSave:false };
function persist(){
  if(SIM.failSave){ S.saveFailed = true; return false; }
  return save();
}

/* ================= 资格判定引擎（答案驱动） ================= */
var EDU_RANK = {"中专或高中":1,"大专":2,"本科":3,"硕士研究生":4,"博士研究生":5};
var DEG_RANK = {"无学位":0,"学士":1,"硕士":2,"博士":3};
var STAGE_RANK = {"幼儿园":1,"小学":2,"初中":3,"高中":4,"中职":4};

function normMajor(m){ return String(m||"").replace(/\s|　/g,"").replace(/[()]/g,function(c){return c==="("?"（":"）";}); }
function majorHit(list, mine){
  var n = normMajor(mine);
  if(!n) return false;
  for(var i=0;i<list.length;i++){
    var t = normMajor(list[i]);
    if(n===t || n.indexOf(t)>-1 || t.indexOf(n)>-1) return true;
  }
  return false;
}

/* 单条件判断 → {v:'ok'|'missing'|'ask'|'no', mine, judge, why, need} */
function judgeReq(r, p){
  var mine, judge, why, need;
  if(r.kind==="edu"){
    if(!p.edu) return {v:"missing", mine:"你还没有填写学历", judge:"暂时无法判断", why:"公告对学历有明确要求，但我们还不知道你的学历。", need:"补充最高学历"};
    mine = p.edu;
    if(EDU_RANK[p.edu] >= EDU_RANK[r.min]) return {v:"ok", mine:mine, judge:"达到公告要求", why:"你填写的学历为「"+p.edu+"」，不低于公告要求的「"+r.min+"」。"};
    return {v:"no", mine:mine, judge:"低于公告要求", why:"公告要求「"+r.min+"」及以上，你填写的是「"+p.edu+"」。", need:"如你的学历信息填写有误，可以回到我的资料修改"};
  }
  if(r.kind==="degree"){
    if(!p.degree) return {v:"missing", mine:"你还没有填写学位", judge:"暂时无法判断", why:"公告对学位有单独要求，但我们还不知道你的学位。", need:"补充学位信息"};
    mine = p.degree;
    if(DEG_RANK[p.degree] >= DEG_RANK[r.min]) return {v:"ok", mine:mine, judge:"达到公告要求", why:"你填写的学位为「"+p.degree+"」，不低于公告要求的「"+r.min+"」。"};
    return {v:"no", mine:mine, judge:"低于公告要求", why:"公告要求「"+r.min+"」及以上学位，你填写的是「"+p.degree+"」。", need:"如你的学位信息填写有误，可以回到我的资料修改"};
  }
  if(r.kind==="major"){
    if(!p.major) return {v:"missing", mine:"你还没有填写专业全称", judge:"暂时无法判断", why:"专业要求要按毕业证上的专业全称逐项核对。", need:"补充毕业证上的专业全称"};
    mine = p.major;
    if(r.forceAsk) return {v:"ask", mine:mine, judge:"需要向招聘单位确认", why:r.askWhy||"公告里的专业口径不够明确。", need:"建议问一下招聘单位，你的专业是否被接受"};
    if(majorHit(r.accept||[], p.major)) return {v:"ok", mine:mine, judge:"在公告列出的专业范围内", why:"你的专业「"+p.major+"」与公告列出的专业要求一致。"};
    if(majorHit(r.ambiguous||[], p.major)) return {v:"ask", mine:mine, judge:"需要向招聘单位确认", why:"你的专业「"+p.major+"」与公告写的专业名称相近但不完全一致，公告也没有列出相近专业的范围。", need:"建议问一下招聘单位是否接受这个专业"};
    return {v:"no", mine:mine, judge:"不在公告列出的专业范围内", why:"公告要求「"+(r.official||"")+"」，你填写的专业是「"+p.major+"」，两者不一致。", need:"如专业名称填写不完整，可以回到我的资料按毕业证修改"};
  }
  if(r.kind==="cert"){
    if(!p.cert) return {v:"missing", mine:"你还没有填写教师资格情况", judge:"暂时无法判断", why:"公告对教师资格的学段和学科有要求。", need:"补充教师资格情况"};
    mine = p.cert + (p.certStage?("：" + p.certStage + (p.certSubject?" "+p.certSubject:"")):"") + (p.certEta?("，预计 "+p.certEta+" 取得"):"");
    if(p.cert==="暂无"){
      return {v:"no", mine:mine, judge:"暂时不满足", why:"公告要求具有「"+r.stage+r.subject+"」教师资格，你填写的是「暂无」。", need:"取得教师资格或考试合格证明后可以重新判断"};
    }
    if(p.cert==="计划取得" || p.cert==="正在认定"){
      return {v:"ask", mine:mine, judge:"需要确认取得时间是否来得及", why:"公告对取得时间有截止要求（"+(r.official||"")+"），你的资格还在办理中。", need:"建议问一下招聘单位，你的预计取得时间是否来得及"};
    }
    if((p.cert==="考试合格证明" || p.cert==="师范生职业能力证书") && !r.acceptExamPass){
      return {v:"no", mine:mine, judge:"暂时不满足", why:"这则公告写明考试合格证明不作为报考依据，要求已认定的教师资格证书。", need:"完成教师资格认定后可以重新判断"};
    }
    if(p.certStage && STAGE_RANK[p.certStage] && STAGE_RANK[r.stage] && STAGE_RANK[p.certStage] < STAGE_RANK[r.stage]){
      return {v:"no", mine:mine, judge:"学段低于公告要求", why:"公告要求「"+r.stage+"及以上」教师资格，你填写的学段是「"+p.certStage+"」。", need:"如学段填写有误，可以回到我的资料修改"};
    }
    if(p.certSubject && p.certSubject!==r.subject){
      return {v:"no", mine:mine, judge:"学科与公告要求不一致", why:"公告要求「"+r.subject+"」学科教师资格，你填写的是「"+p.certSubject+"」。", need:"如学科填写有误，可以回到我的资料修改"};
    }
    return {v:"ok", mine:mine, judge:"符合公告要求的学段和学科", why:"你的教师资格情况与公告要求的「"+r.stage+r.subject+"」一致。"};
  }
  if(r.kind==="grad"){
    if(!p.studyState) return {v:"missing", mine:"你还没有填写毕业情况", judge:"暂时无法判断", why:"不同公告对应届条件的定义不同，需要按你的事实情况分别判断。", need:"补充毕业年月与当前情况"};
    mine = (p.studyState||"") + (p.gradYm?("，"+p.gradYm):"") + (p.jobState?("，"+p.jobState):"");
    return {v:"ok", mine:mine, judge:"公告对这项没有限制", why:"这则公告写明应届毕业生与社会在职人员都可以报考。"};
  }
  if(r.kind==="employment"){
    mine = (p.forms&&p.forms.length)? p.forms.join("、") : "你还没有填写可接受的用工形式";
    if(!p.forms || !p.forms.length) return {v:"missing", mine:mine, judge:"暂时无法判断", why:"我们还不知道你能接受哪些官方招聘形式。", need:"补充可接受的用工形式"};
    if(p.forms.indexOf("暂时不确定")>-1) return {v:"ask", mine:mine, judge:"需要你自己再确认", why:"你选择了「暂时不确定」，这项由你自己决定，我们不替你判断。", need:"确定后可以回到我的资料修改"};
    if(r.form==="待确认") return {v:"ask", mine:mine, judge:"公告没有写明编制性质", why:"公告没有写明这个岗位是不是事业编，我们不能因为岗位在公办学校就推断为事业编。", need:"建议问一下招聘单位这个岗位的用工性质"};
    if(p.forms.indexOf(r.form)>-1) return {v:"ok", mine:mine, judge:"在你接受的范围内", why:"这个岗位是「"+r.form+"」，在你选择可以接受的范围内。"};
    return {v:"no", mine:mine, judge:"不在你接受的范围内", why:"这个岗位是「"+r.form+"」，你填写的可接受形式是「"+p.forms.join("、")+"」。", need:"如你愿意考虑这种形式，可以回到我的资料修改"};
  }
  if(r.kind==="extra"){
    var val = p.extra && p.extra[r.field];
    if(val==null || val==="") return {v:"missing", mine:"你还没有填写这项", judge:"暂时无法判断", why:r.why||"公告明确要求这项条件，但我们还不知道你的情况。", need:"补充这项信息"};
    if(val==="不确定") return {v:"ask", mine:"你填写了「不确定」", judge:"需要你再核实", why:"你对这项还不确定，我们不会因此判断为不符合。", need:"核实后可以补充，或问一下招聘单位"};
    mine = String(val);
    if(r.field==="hukou"){
      var ok = /宁波|有效居住证/.test(mine);
      if(ok) return {v:"ok", mine:mine, judge:"满足公告的户籍或居住证要求", why:"你填写的是「"+mine+"」，与公告要求一致。"};
      return {v:"no", mine:mine, judge:"暂时不满足", why:"公告要求宁波市户籍或有效居住证，你填写的是「"+mine+"」。", need:"如你已办理居住证，可以回到我的资料修改"};
    }
    if(r.field==="age"){
      var n = parseInt(mine,10);
      var cap = (p.edu==="硕士研究生"||p.edu==="博士研究生") ? 35 : 30;
      if(isNaN(n)) return {v:"ask", mine:mine, judge:"无法读取年龄", why:"年龄填写格式不明确。", need:"重新填写年龄"};
      if(n<=cap) return {v:"ok", mine:mine+" 周岁", judge:"在公告年龄范围内", why:"按你的学历，公告的年龄上限为 "+cap+" 周岁，你填写的是 "+n+" 周岁。"};
      return {v:"no", mine:mine+" 周岁", judge:"超出公告年龄上限", why:"按你的学历，公告的年龄上限为 "+cap+" 周岁，你填写的是 "+n+" 周岁。", need:"如年龄填写有误，可以回到我的资料修改"};
    }
    if(r.field==="mandarin"){
      var okm = /一级|二级甲等/.test(mine);
      if(okm) return {v:"ok", mine:mine, judge:"达到公告要求", why:"公告要求二级甲等及以上，你填写的是「"+mine+"」。"};
      if(/未取得|还没/.test(mine)) return {v:"no", mine:mine, judge:"暂时不满足", why:"公告要求普通话二级甲等及以上。", need:"取得证书后可以重新判断"};
      return {v:"no", mine:mine, judge:"低于公告要求", why:"公告要求二级甲等及以上，你填写的是「"+mine+"」。", need:"如等级填写有误，可以回到我的资料修改"};
    }
    return {v:"ok", mine:mine, judge:"已记录", why:"你已填写这项信息。"};
  }
  return {v:"missing", mine:"—", judge:"暂时无法判断", why:"这项条件还需要更多信息。"};
}

/* 机会整体判定 */
function evaluate(o){
  var p = S.profile;
  var rows = (o.reqs||[]).map(function(r){ var j = judgeReq(r,p); j.r = r; return j; });
  var v;
  var status = effectiveStatus(o);
  if(status==="closed") v = "closed";
  else if(status==="cancelled") v = "cancelled";
  else if(rows.some(function(x){return x.v==="no";})) v = "no";
  else if(rows.some(function(x){return x.v==="ask";})) v = "ask";
  else if(rows.some(function(x){return x.v==="missing";})) v = "missing";
  else v = "ok";

  var lead = null;
  if(v==="no") lead = rows.filter(function(x){return x.v==="no";})[0];
  else if(v==="ask") lead = rows.filter(function(x){return x.v==="ask";})[0];
  else if(v==="missing") lead = rows.filter(function(x){return x.v==="missing";})[0];

  var reason;
  if(v==="ok") reason = "学历、专业和教师资格都对得上，没有发现明确不符合的条件。";
  else if(v==="missing") reason = "「"+lead.r.label+"」这项公告有明确要求，我们还不知道你的情况。";
  else if(v==="ask") reason = "「"+lead.r.label+"」这项公告写得不够明确，建议问一下招聘单位。";
  else if(v==="no") reason = "「"+lead.r.label+"」这项明确条件暂时不满足。";
  else if(v==="cancelled") reason = "这个岗位已被招聘单位取消，不再接受报名。";
  else reason = "这个批次的报名已经结束。";

  /* 地区偏好分：must=3 prefer=2 ok=1 未选=0 */
  var tier = regionTier(o);
  return {
    v:v, rows:rows, lead:lead, reason:reason, tier:tier,
    missingFields: rows.filter(function(x){return x.v==="missing" && x.r.kind==="extra";}).map(function(x){return x.r.field;}),
    score: (tier*100) + ({ok:40,missing:28,ask:24,no:4,closed:1,cancelled:1}[v]) + (formScore(o)*3)
  };
}
function regionTier(o){
  var regs = S.profile.regions||[];
  var best = 0;
  for(var i=0;i<regs.length;i++){
    var r = regs[i], w = r.tier==="must"?3:(r.tier==="prefer"?2:1);
    var match = false;
    if(r.n===o.city || r.n===o.province) match = true;
    else if(REGION_GROUPS[r.n] && REGION_GROUPS[r.n].indexOf(o.province)>-1) match = true;
    if(match && w>best) best = w;
  }
  return best;
}
function formScore(o){
  var f = S.profile.forms||[];
  if(!f.length || f.indexOf("暂时不确定")>-1) return 1;
  return f.indexOf(o.employment)>-1 ? 2 : 0;
}
/* 覆盖范围内、且与用户地区偏好相关的机会 */
function matchedOpps(){
  var regs = S.profile.regions||[];
  var list = OPPS.map(function(o){ var e = evaluate(o); return {o:o, e:e}; });
  if(regs.length && !S.profile.regionUndecided){
    var inPref = list.filter(function(x){ return x.e.tier>0; });
    /* 用户明确选了地区时，不用其他地区的机会填满结果。
       没有命中就进入「暂未收录」空状态，避免把无关岗位误当推荐。 */
    list = inPref;
  }
  list.sort(function(a,b){ return b.e.score - a.e.score; });
  return list;
}
function groupOpps(list){
  var g = {ok:[], missing:[], ask:[], no:[], done:[]};
  list.forEach(function(x){
    if(x.e.v==="ok") g.ok.push(x);
    else if(x.e.v==="missing") g.missing.push(x);
    else if(x.e.v==="ask") g.ask.push(x);
    else if(x.e.v==="no") g.no.push(x);
    else g.done.push(x);
  });
  /* 来源失效的机会降低优先级：放到本组末尾 */
  ["ok","missing","ask"].forEach(function(k){
    g[k].sort(function(a,b){ return (a.o.sourceOk===false?1:0) - (b.o.sourceOk===false?1:0); });
  });
  return g;
}
/* 补充某字段后可以继续判断的机会数 */
function affectedBy(field){
  var n = 0;
  matchedOpps().forEach(function(x){
    if(x.o.status!=="open") return;
    if(x.e.missingFields.indexOf(field)>-1) n++;
  });
  return n || 1;
}
/* 覆盖范围检查：用户选的地区是否被收录 */
function uncoveredPicks(){
  return (S.profile.regions||[]).filter(function(r){
    var reg = regionByName(r.n);
    return reg && reg.c===false;
  });
}

/* ================= 关注与报考状态 ================= */

function urgentTask(){

    var d = daysTo(x.o.deadline);

  });

    return {x:any, days:null, action:nextAction(any.o, any.e, any.f)};
  }

      var ea = (A.o.timeline||[]).filter(function(t){return t.t==="笔试" && t.d;})[0];
      var eb = (B.o.timeline||[]).filter(function(t){return t.t==="笔试" && t.d;})[0];

/* ================= UI 基础：Toast / 弹层 / 焦点 ================= */
function toast(msg){
  var t = el('<div class="toast">'+esc(msg)+'</div>');
  $("#toasts").appendChild(t);
  setTimeout(function(){ t.style.transition="opacity 220ms"; t.style.opacity="0"; setTimeout(function(){ t.remove(); }, 240); }, 3200);
}
var LAYER = { stack:[] };
function focusables(root){
  return Array.prototype.filter.call(
    root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
    function(n){ return n.offsetParent !== null || n === document.activeElement; });
}
function openLayer(node, opts){
  opts = opts||{};
  var prev = document.activeElement;
  var scrim = el('<div class="scrim'+(opts.drawer?" drawer-scrim":"")+'" role="dialog" aria-modal="true"></div>');
  if(opts.labelId) scrim.setAttribute("aria-labelledby", opts.labelId);
  scrim.appendChild(node);
  $("#layer").appendChild(scrim);
  document.body.style.overflow = "hidden";
  var rec = {scrim:scrim, prev:prev, onClose:opts.onClose};
  LAYER.stack.push(rec);
  scrim.addEventListener("mousedown", function(e){ if(e.target===scrim) closeLayer(); });
  scrim.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ e.stopPropagation(); closeLayer(); return; }
    if(e.key==="Tab"){
      var f = focusables(node); if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });
  var f = focusables(node);
  setTimeout(function(){ (opts.focus? node.querySelector(opts.focus) : null) ? node.querySelector(opts.focus).focus() : (f[0]? f[0].focus() : node.focus()); }, 30);
  return rec;
}
function closeLayer(){
  var rec = LAYER.stack.pop(); if(!rec) return;
  rec.scrim.remove();
  if(!LAYER.stack.length) document.body.style.overflow = "";
  if(rec.prev && rec.prev.focus) try{ rec.prev.focus(); }catch(e){}
  if(rec.onClose) rec.onClose();
}
function closeAllLayers(){ while(LAYER.stack.length) closeLayer(); }

function modal(opts){
  /* opts: title, body(html), actions:[{label, primary, onClick, close}], note */
  var id = "mt-"+Math.random().toString(36).slice(2,8);
  var m = el('<div class="modal"></div>');
  m.innerHTML =
    '<div class="modal__h">'+
      '<h2 class="t-h3 od-fill" id="'+id+'">'+esc(opts.title)+'</h2>'+
      '<button class="iconbtn" type="button" data-x aria-label="关闭">'+ICO.close+'</button>'+
    '</div>'+
    '<div class="modal__b">'+(opts.body||"")+'<div class="od-stack" data-acts style="--od-gap:10px"></div></div>';
  var acts = m.querySelector("[data-acts]");
  (opts.actions||[]).forEach(function(a){
    var b = el('<button class="btn '+(a.primary?"btn--primary":(a.danger?"btn--danger":"btn--ghost"))+' btn--block" type="button">'+esc(a.label)+'</button>');
    b.addEventListener("click", function(){ if(a.onClick) a.onClick(m); if(a.close!==false) closeLayer(); });
    acts.appendChild(b);
  });
  m.querySelector("[data-x]").addEventListener("click", closeLayer);
  openLayer(m, {labelId:id, focus:opts.focus, onClose:opts.onClose});
  return m;
}
function drawer(opts){
  var id = "dt-"+Math.random().toString(36).slice(2,8);
  var d = el('<div class="drawer"></div>');
  d.innerHTML =
    '<div class="drawer__h">'+

    '</div><div class="drawer__b">'+(opts.body||"")+'</div>';
  d.querySelector("[data-x]").addEventListener("click", closeLayer);
  openLayer(d, {drawer:true, labelId:id});

/* ================= 路由 ================= */
var ROUTES = [];
function route(pattern, view){ ROUTES.push({p:pattern, v:view}); }
function navigate(hash, replace){
  if(replace) location.replace(hash); else location.hash = hash;
}
function currentPath(){
  var h = location.hash.replace(/^#/, "").split("?")[0].split("#")[0];
  if(!h || h==="/") return "/";
  return h.replace(/\/+$/,"") || "/";
}
function matchRoute(path){
  for(var i=0;i<ROUTES.length;i++){
    var parts = ROUTES[i].p.split("/"), seg = path.split("/");
    if(parts.length!==seg.length) continue;
    var params = {}, ok = true;
    for(var j=0;j<parts.length;j++){
      if(parts[j].charAt(0)===":"){ params[parts[j].slice(1)] = decodeURIComponent(seg[j]); }
      else if(parts[j]!==seg[j]){ ok=false; break; }
    }
    if(ok) return {v:ROUTES[i].v, params:params};
  }
  return null;
}
var RENDER_TOKEN = 0;
function render(){
  closeAllLayers();
  var path = currentPath();
  var m = matchRoute(path);
  RENDER_TOKEN++;
  var main = $("#main");
  main.innerHTML = "";
  if(!m){ main.appendChild(viewNotFound()); }
  else { var node = m.v(m.params); if(node) main.appendChild(node); }
  chrome(path);
  window.scrollTo(0,0);
  setTimeout(function(){ try{ main.focus({preventScroll:true}); }catch(e){ main.focus(); } }, 0);
  document.title = (window.__pageTitle || "教招有据") + " · 教师招聘、报考与备考助手";
  window.__pageTitle = null;
}
function setTitle(t){ window.__pageTitle = t; }
window.addEventListener("hashchange", render);
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && LAYER.stack.length){ closeLayer(); }
});

/* 页内委托：data-go / data-ext */
document.addEventListener("click", function(e){
  var g = e.target.closest ? e.target.closest("[data-go]") : null;
  if(g){ e.preventDefault(); navigate(g.getAttribute("data-go")); return; }
  var x = e.target.closest ? e.target.closest("[data-ext]") : null;
  if(x){ e.preventDefault(); externalLink(x.getAttribute("data-ext"), x.getAttribute("data-ext-label")||"前往官方页面", x.getAttribute("data-ext-note")); }
});

    '<input class="input" id="lg-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号" />'+
    '<div class="hint">演示原型：输入任意 11 位数字即可登录，不会真的发送短信，也不会上传任何信息。</div>'+
    '<div class="err" id="lg-err" hidden></div></div>';
  var m = modal({
    title:"登录后再继续",
    body:body,
    focus:"#lg-phone",
    actions:[
      {label:"模拟登录并继续", primary:true, close:false, onClick:function(node){
        var v = node.querySelector("#lg-phone").value.replace(/\D/g,"");
        var err = node.querySelector("#lg-err");
        if(v.length!==11){
          err.hidden = false;
          err.textContent = "请输入 11 位手机号，例如 13800000000。只用于在这台设备上保存你的进度。";
          node.querySelector("#lg-phone").focus();
          return;
        }
        S.auth = {phone:v, at:Date.now()};
        persist();
        closeLayer();
        toast("模拟登录成功，刚才填写的内容已保留在本机");
        after();
      }},
      {label:"先不登录", onClick:function(){}}
    ]
  });
  return m;
}

}

/* ================= 地区选择器（第一问 / 第一步共用） ================= */
function regionPicker(onChange){
  var node = el('<div class="od-stack" style="--od-gap:14px"></div>');
  var TIER = [["must","我必须考虑的地区"],["prefer","我优先考虑的地区"],["ok","我也可以考虑的地区"]];
  var tier = "must";
  node.innerHTML =
    '<div class="od-stack" style="--od-gap:8px">'+
      '<label class="label" for="rg-q">搜索城市、省份或跨省区域</label>'+
      '<input class="input" id="rg-q" type="search" autocomplete="off" placeholder="例如 杭州、浙江省、长三角" aria-describedby="rg-help" />'+
      '<div class="hint" id="rg-help">可以选多个地区，再把它们分到三个优先级里。</div>'+
      '<div class="od-cluster" role="group" aria-label="当前添加到哪一类" data-tiers style="--od-gap:6px"></div>'+
      '<div class="od-stack" data-res style="--od-gap:6px" role="listbox" aria-label="搜索结果"></div>'+
    '</div>'+
    '<div class="od-stack" data-picked style="--od-gap:12px"></div>'+
    '<div class="od-cluster" style="--od-gap:10px">'+
      '<button class="btn btn--ghost btn--sm" type="button" data-unsure>还没想好</button>'+
      '<button class="btn btn--quiet" type="button" data-go="#/coverage">查看当前覆盖范围</button>'+
    '</div>';
  var q = node.querySelector("#rg-q"), res = node.querySelector("[data-res]"),
      picked = node.querySelector("[data-picked]"), tiersEl = node.querySelector("[data-tiers]");

  function drawTiers(){
    tiersEl.innerHTML = TIER.map(function(t){
      return '<button class="chip'+(tier===t[0]?' chip--note':' chip--plain')+'" type="button" data-t="'+t[0]+'" aria-pressed="'+(tier===t[0])+'">'+t[1]+'</button>';
    }).join("");
    Array.prototype.forEach.call(tiersEl.querySelectorAll("[data-t]"), function(b){
      b.addEventListener("click", function(){ tier = b.getAttribute("data-t"); drawTiers(); });
    });
  }
  function drawRes(){
    var v = q.value.trim();
    if(!v){
      var hot = REGIONS.filter(function(r){ return r.c; }).slice(0,6);
      res.innerHTML = '<div class="t-xs">常被搜索的地区</div><div class="od-cluster" style="--od-gap:6px">'+
        hot.map(function(r){ return '<button class="chip chip--plain" type="button" data-add="'+esc(r.n)+'">'+ICO.plus+esc(r.n)+'</button>'; }).join("")+'</div>';
    } else {
      var hit = REGIONS.filter(function(r){ return r.n.indexOf(v)>-1 || r.p.indexOf(v)>-1; }).slice(0,8);
      res.innerHTML = hit.length
        ? hit.map(function(r){
            return '<button class="opt" type="button" data-add="'+esc(r.n)+'">'+
              '<span class="od-fixed" style="color:var(--body);margin-top:3px">'+ICO.pin+'</span>'+
              '<span class="od-fill od-field"><span class="opt__t">'+esc(r.n)+'</span>'+
              '<span class="opt__d">'+esc(r.p)+(r.c?" · 已收录招聘批次":" · 暂未收录")+'</span></span>'+
              '<span class="od-fixed" style="color:var(--ink-2)">'+ICO.plus+'</span></button>';
          }).join("")
        : '<div class="callout callout--grey"><div class="strong">没有找到「'+esc(v)+'」</div>'+
          '<div class="t-sm" style="color:inherit">可以试试填写省份名称，或者先选「还没想好」。</div></div>';
    }
    Array.prototype.forEach.call(res.querySelectorAll("[data-add]"), function(b){
      b.addEventListener("click", function(){ add(b.getAttribute("data-add")); });
    });
  }
  function add(n){
    var p = S.profile;
    if(p.regions.some(function(r){ return r.n===n; })){ toast("「"+n+"」已经在列表里了"); return; }
    var reg = regionByName(n) || {n:n, p:""};
    p.regions.push({n:n, p:reg.p, tier:tier});
    p.regionUndecided = false;
    q.value = ""; drawRes(); drawPicked(); persist(); if(onChange) onChange();
  }
  function drawPicked(){
    var p = S.profile;
    if(p.regionUndecided){
      picked.innerHTML = '<div class="callout callout--note"><div class="strong">先按「还没想好」继续</div>'+
        '<div class="t-sm" style="color:inherit">我们会先把已收录地区的机会都显示出来，你随时可以再加地区。</div></div>';
      return;
    }
    if(!p.regions.length){ picked.innerHTML = '<div class="hint">还没有选择地区。选一个你愿意去的地方就可以开始。</div>'; return; }
    picked.innerHTML = TIER.map(function(t){
      var list = p.regions.filter(function(r){ return r.tier===t[0]; });
      if(!list.length) return "";
      return '<div class="od-stack" style="--od-gap:8px"><div class="label">'+t[1]+'</div>'+
        '<div class="od-cluster" style="--od-gap:8px">'+list.map(function(r){
          var uncov = (regionByName(r.n)||{}).c===false;
          return '<span class="chip'+(uncov?'':' chip--note')+'">'+esc(r.n)+
            (uncov?'<span class="t-xs" style="color:var(--ask-ink)">暂未收录</span>':'')+
            '<button type="button" class="od-touch" data-rm="'+esc(r.n)+'" aria-label="删除 '+esc(r.n)+'" style="background:none;border:0;cursor:pointer;min-width:28px;min-height:28px;display:grid;place-items:center">'+ICO.close+'</button>'+
            '</span>';
        }).join("")+'</div>'+
        '<div class="od-cluster" style="--od-gap:6px">'+list.map(function(r){
          return TIER.filter(function(t2){ return t2[0]!==r.tier; }).map(function(t2){
            return '<button class="btn btn--quiet btn--sm" type="button" data-mv="'+esc(r.n)+'" data-to="'+t2[0]+'">把 '+esc(r.n)+' 改为'+t2[1].replace("我","")+'</button>';
          }).join("");
        }).join("")+'</div></div>';
    }).join("");
    Array.prototype.forEach.call(picked.querySelectorAll("[data-rm]"), function(b){
      b.addEventListener("click", function(){
        S.profile.regions = S.profile.regions.filter(function(r){ return r.n!==b.getAttribute("data-rm"); });
        persist(); drawPicked(); if(onChange) onChange();
      });
    });
    Array.prototype.forEach.call(picked.querySelectorAll("[data-mv]"), function(b){
      b.addEventListener("click", function(){
        var n = b.getAttribute("data-mv"), to = b.getAttribute("data-to");
        S.profile.regions.forEach(function(r){ if(r.n===n) r.tier = to; });
        persist(); drawPicked(); if(onChange) onChange();
      });
    });
  }
  q.addEventListener("input", drawRes);
  node.querySelector("[data-unsure]").addEventListener("click", function(){
    S.profile.regionUndecided = true; S.profile.regions = [];
    persist(); drawPicked(); if(onChange) onChange();
    toast("暂时不确定也没关系，先看现在能够判断的结果。");
  });
  drawTiers(); drawRes(); drawPicked();
  return node;
}

function bindOppCards(root){
  Array.prototype.forEach.call(root.querySelectorAll("[data-act]"), function(b){

function doPrimaryAction(o, e){
  var act = nextAction(o, e, S.follows[o.id]);
  if(act.ask){ askExtra(act.ask, o); return; }
  if(act.consult){ navigate("#/opportunities/"+o.id); setTimeout(function(){ consultDrawer(o, e); }, 420); return; }
  if(act.external && e.v==="ok" && daysTo(o.deadline)>5){ externalLink(o.url, "查看官方原文", "即将离开教招有据，前往官方页面查看公告原文。"); return; }
  if(act.external){ applyEntry(o); return; }
  navigate(act.href);
}

  /* 各步骤表单 */

            ["仍在读，还没毕业","已经毕业"].map(function(v){ return radioOpt(v, S.profile.studyState===v); }).join("")+
          '</div></div>'+
        '<div class="od-stack" style="--od-gap:8px"><div class="label" id="lb-job">你现在的就业情况</div>'+
          '<div class="od-stack" style="--od-gap:8px" role="radiogroup" aria-labelledby="lb-job" data-g="jobState">'+
            ["没有工作","有工作，签了劳动合同并缴社保","有工作，没有缴社保","暂时不确定"].map(function(v){ return radioOpt(v, S.profile.jobState===v); }).join("")+
          '</div>'+
          '<div class="hint">我们只记录事实情况，不让你直接勾选「应届生」——不同公告对应届的定义不一样。</div></div>'+
      '</div>';
    body.querySelector("#gy").addEventListener("change", function(e){ S.profile.gradYm = e.target.value; persist(); ack(); });
    bindGroup(body, "studyState", function(v){ S.profile.studyState=v; persist(); ack(); }, true);
    bindGroup(body, "jobState", function(v){ S.profile.jobState=v; persist(); ack(); }, true);
  }
  if(step.k==="cert"){
    body.innerHTML =
      '<div class="od-stack" style="--od-gap:18px">'+

            [["已取得","已经拿到教师资格证书"],
             ["考试合格证明","笔试面试都过了，还没完成认定"],

              return radioOpt(v[0], S.profile.cert===v[0], v[1]);
            }).join("")+'</div></div>'+
        '<div class="od-grid" style="--od-cols:2;--od-gap:12px">'+

              return '<option value="'+esc(v)+'"'+(S.profile.certStage===v?" selected":"")+'>'+(v||"请选择")+'</option>'; }).join("")+'</select></div>'+
          '<div class="od-stack" style="--od-gap:6px"><label class="label" for="cj">学科</label>'+
            '<select class="select" id="cj">'+["","语文","数学","英语","其他学科"].map(function(v){
              return '<option value="'+esc(v)+'"'+(S.profile.certSubject===v?" selected":"")+'>'+(v||"请选择")+'</option>'; }).join("")+'</select></div>'+
        '</div>'+
        '<div class="od-stack" style="--od-gap:6px"><label class="label" for="ce">预计取得时间（还没取得时填写）</label>'+

      '</div>';
    bindGroup(body, "cert", function(v){ S.profile.cert=v; persist(); ack(); }, true);
    body.querySelector("#cs").addEventListener("change", function(e){ S.profile.certStage=e.target.value; persist(); ack(); });
    body.querySelector("#cj").addEventListener("change", function(e){ S.profile.certSubject=e.target.value; persist(); ack(); });
    body.querySelector("#ce").addEventListener("change", function(e){ S.profile.certEta=e.target.value; persist(); ack(); });
  }
  if(step.k==="forms"){
    var FORMS = [["事业编","事业编（正式编制内）","正式编制内岗位，工资和退休按事业单位政策"],

      ["员额制","员额制","按核定的人员额度聘用，合同制管理"],
      ["控制数","控制数或储备教师","使用编制外控制数，部分地区有机会转为在编"],
      ["暂时不确定","暂时不确定","先都看看，之后再决定"]];
    body.innerHTML = '<div class="od-stack" style="--od-gap:8px" role="group" aria-label="可以接受的用工形式">'+
      FORMS.map(function(f){

      }).join("")+'</div>'+

          if(f.indexOf(v)>-1) f = f.filter(function(k){ return k!==v; }); else f.push(v);
        }
        S.profile.forms = f; persist();
        Array.prototype.forEach.call(body.querySelectorAll("[data-f]"), function(o2){
          o2.setAttribute("aria-pressed", String(f.indexOf(o2.getAttribute("data-f"))>-1));
        });
        ack();
      });
    });

    if(step.k==="edu") return (!p.edu || !p.degree) ? "先选择最高学历和学位；不确定可以点「以后再填」。" : "";
    if(step.k==="major") return !p.major ? "填一下毕业证上的专业全称，或者点「以后再填」。" : "";
    if(step.k==="grad") return (!p.gradYm || !p.studyState || !p.jobState) ? "先补齐毕业年月、学业情况和就业情况；不确定可以稍后再填。" : "";
    if(step.k==="cert"){
      if(!p.cert) return "先选择教师资格当前状态；不确定可以稍后再填。";
      if(p.cert!=="暂无" && (!p.certStage || !p.certSubject)) return "再补充教师资格的学段和学科，判断才会更准确。";
      if((p.cert==="计划取得" || p.cert==="正在认定") && !p.certEta) return "再填写预计取得时间，或者选择以后再填。";
      return "";
    }
    if(step.k==="forms") return !(p.forms||[]).length ? "先选一种可以接受的用工形式，或者选「暂时不确定」。" : "";
    return "";
  }
  n.querySelector("[data-next]").addEventListener("click", function(){

    var saved = (step.fbd? step.fbd(S.profile) : step.fb);
    setTimeout(function(){ done(saved); }, 220);
  });
  n.querySelector("[data-skip]").addEventListener("click", function(){
    showFb("暂时不确定也没关系，先看现在能够判断的结果。");
    setTimeout(function(){ done("上一步暂时跳过了，之后可以在“我的资料”里补充。"); }, 300);
  });
  return n;
}
function radioOpt(v, on, desc){
  return '<button class="opt opt--radio" type="button" role="radio" aria-checked="'+(!!on)+'" data-v="'+esc(v)+'">'+
    '<span class="opt__box">'+ICO.ok+'</span><span class="od-fill od-field">'+
    '<span class="opt__t">'+esc(v)+'</span>'+(desc?'<span class="opt__d">'+esc(desc)+'</span>':'')+'</span></button>';
}
function bindGroup(root, name, cb, radio){
  var g = root.querySelector('[data-g="'+name+'"]'); if(!g) return;
  Array.prototype.forEach.call(g.querySelectorAll("[data-v]"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(g.querySelectorAll("[data-v]"), function(o2){
        var on = o2===b;
        o2.setAttribute("aria-checked", String(on));
        if(o2.classList.contains("chip")) o2.className = "chip"+(on?" chip--note":" chip--plain")+" od-touch";
      });
      cb(b.getAttribute("data-v"));
    });
  });
}

function viewOpportunities(){

  var TABS = [
    {k:"all", t:"全部", list:list},

    {k:"no", t:"明确不符合", list:g.no},

  ];
  if(S.auth) TABS.push({k:"follow", t:"我关注的", list:followedList()});

  '<div class="wrap od-stack" style="--od-gap:24px">'+
    '<div class="od-stack" style="--od-gap:10px">'+
      '<h1 class="t-h2">机会</h1>'+

      '<div class="od-cluster" style="--od-gap:8px">'+demoChip()+
        '<span class="chip chip--plain">最后更新 '+esc(COVERAGE.updated)+'</span>'+
        '<a class="btn btn--quiet btn--sm" href="#/me/profile">修改我的资料</a></div>'+
    '</div>'+
    '<div class="tabs" role="tablist" aria-label="按判断结果筛选">'+
      TABS.map(function(t){
        return '<button class="tab" type="button" role="tab" aria-selected="'+(t.k===cur)+'" data-tab="'+t.k+'">'+esc(t.t)+'（'+t.list.length+'）</button>';
      }).join("")+
    '</div>'+
    '<div data-list></div>'+
    demoNote()+
  '</div>';

  var host = n.querySelector("[data-list]");

    var t = TABS.filter(function(x){ return x.k===cur; })[0];
    if(!t.list.length){
      host.innerHTML = '<div class="state"><span class="state__i">'+ICO.list+'</span>'+
        '<h2 class="t-h3">这一类暂时没有机会</h2>'+
        '<p class="t-body">'+(cur==="follow"
          ? "你还没有关注任何机会。在机会卡上点「关注」，就能在这里集中跟进。"
          : "可以先看看其他分组，或者补充资料让更多机会有结论。")+'</p>'+
        '<div class="od-cluster" style="--od-gap:10px"><button class="btn btn--ghost" type="button" data-all>看全部机会</button>'+
        '<a class="btn btn--quiet" href="#/me/profile">补充我的资料</a></div></div>';
      var ab = host.querySelector("[data-all]");
      if(ab) ab.addEventListener("click", function(){ cur="all"; syncTabs(); draw(); });
      return;
    }
    host.innerHTML = '<div class="od-grid" style="--od-cols:2;--od-gap:16px">'+
      t.list.map(function(x){ return oppCard(x); }).join("")+'</div>';
    bindOppCards(host);
  }
  function syncTabs(){
    window.__oppTab = cur;
    Array.prototype.forEach.call(n.querySelectorAll("[data-tab]"), function(b){
      b.setAttribute("aria-selected", String(b.getAttribute("data-tab")===cur));
    });
  }
  Array.prototype.forEach.call(n.querySelectorAll("[data-tab]"), function(b){
    b.addEventListener("click", function(){ cur = b.getAttribute("data-tab"); syncTabs(); draw(); });
  });
  draw();
  return n;
}

/* ================= 咨询问题抽屉 ================= */
function consultDrawer(o, e){
  e = e || evaluate(o);
  var asks = e.rows.filter(function(x){ return x.v==="ask"; });
  if(!asks.length) asks = e.rows.slice(0,1);
  var qs = asks.map(function(j){
    if(j.r.kind==="major") return "我的毕业证专业是「"+(S.profile.major||"（请填写你的专业）")+"」，公告正文写「"+(o.conflict?o.conflict.a.text:(j.r.official||""))+"」，岗位表写「"+(o.conflict?o.conflict.b.text:(j.r.official||""))+"」，请问我的专业是否可以报考这个岗位？";
    if(j.r.kind==="employment") return "公告没有写明这个岗位的用工性质，请问是事业编制、备案制还是其他形式？待遇和管理按什么政策执行？";
    if(j.r.kind==="cert") return "我的教师资格目前是「"+(S.profile.cert||"")+"」"+(S.profile.certEta?("，预计 "+S.profile.certEta+" 取得"):"")+"，请问是否符合公告「"+(j.r.official||"")+"」的要求？";
    return "关于公告中「"+j.r.label+"」这一项（"+(j.r.official||"")+"），请问具体怎么认定？";
  });
  var body =
    '<div class="callout callout--note"><div class="strong">这几句话问清楚就够了</div>'+
      '<div class="t-sm" style="color:inherit">我们不替你打电话，也不替你向官方提交任何材料。下面是按公告原文整理好的问题，你可以直接照着问。</div></div>'+
    '<div class="od-stack" style="--od-gap:12px">'+
      '<div class="label">建议这样问</div>'+
      qs.map(function(q,i){ return '<div class="src">'+(i+1)+'. '+esc(q)+'</div>'; }).join("")+
    '</div>'+
    '<dl class="ev">'+
      evRow("官方咨询方式", '<span class="strong">'+esc(o.contact)+'</span>')+
      evRow("依据位置", esc(o.tableLoc))+
      evRow("公告发布单位", esc(o.publisher))+
    '</dl>'+
    '<div class="od-stack" style="--od-gap:10px">'+
      '<button class="btn btn--primary btn--block" type="button" data-copyq>'+ICO.copy+'复制全部问题</button>'+
      '<button class="btn btn--ghost btn--block" type="button" data-copyt>复制官方咨询电话</button>'+
      '<button class="btn btn--ghost btn--block" type="button" data-done>我已经问过了，记录答复</button>'+
    '</div>'+
    '<p class="t-xs">演示数据：联系方式为示例，不是真实电话。</p>';
  var dr = drawer({title:"向招聘单位确认", body:body});
  dr.querySelector("[data-copyq]").addEventListener("click", function(){ copyText(qs.map(function(q,i){ return (i+1)+". "+q; }).join("\n")); });
  dr.querySelector("[data-copyt]").addEventListener("click", function(){ copyText(o.contact); });
  dr.querySelector("[data-done]").addEventListener("click", function(){
    closeLayer();
    requireAuth("记录官方答复", function(){
      var body2 = '<div class="od-stack" style="--od-gap:8px"><label class="label" for="cs-a">招聘单位怎么答复的？</label>'+
        '<textarea class="textarea" id="cs-a" rows="4" placeholder="例如：工作人员说汉语国际教育专业可以报考，按岗位表口径执行。"></textarea>'+
        '<div class="hint">只保存在你的账号里，用于提醒你这项已经确认过，不会公开，也不会改变公告原文。</div></div>';
      modal({title:"记录官方答复", body:body2, focus:"#cs-a", actions:[
        {label:"保存答复", primary:true, close:false, onClick:function(node){
          var v = (node.querySelector("#cs-a").value||"").trim();
          if(!v){ toast("先写一下答复内容"); return; }
          follow(o.id);
          S.follows[o.id].consults.push({at:Date.now(), text:v});
          var ok = persist(); closeLayer();
          if(!ok){ saveFailedModal(null); return; }
          toast("已记录答复，这项会标注为「已向官方确认」");
          render();
        }},
        {label:"先不记录", onClick:function(){}}
      ]});
    });
  });
  return dr;
}

    '<dl class="ev">'+
      evRow("涉及机会", esc(o.title))+

    '<div>'+backLink("#/opportunities/"+o.id,"返回这条机会")+'</div>'+

      '<h1 class="t-h2">需要准备哪些材料</h1>'+

      '<div class="od-cluster" style="--od-gap:8px">'+demoChip()+'<span class="chip chip--plain">依据：'+esc(o.announce)+'</span></div>'+
    '</div>'+
    (S.auth? '' : '<div class="callout callout--note"><div class="strong">登录后可以保存准备进度</div>'+
      '<div class="t-sm" style="color:inherit">现在也可以查看完整清单，勾选状态需要登录才能保存。</div></div>')+
    '<div class="od-stack" data-ms style="--od-gap:12px"></div>'+
    '<div class="callout callout--grey"><div class="strong">我们不收集这些材料</div>'+
      '<div class="t-sm" style="color:inherit">这里只是清单和进度，不需要你上传证件或证明文件的扫描件。</div></div>'+
    demoNote()+
  '</div>';

  var host = n.querySelector("[data-ms]");
  function draw(){
    f = S.follows[o.id];
    var readyCount = 0;
    host.innerHTML = ms.map(function(m, i){
      var st = (f && f.materials && f.materials[m.t]) || "未准备";
      if(st==="已准备好") readyCount++;
      return '<div class="card card--flat"><div class="card__b card__b--tight od-stack" style="--od-gap:12px">'+
        '<div class="od-row" style="--od-gap:10px;flex-wrap:wrap">'+
          '<span class="strong od-fill">'+esc(m.t)+'</span>'+
          '<span class="chip'+(st==="已准备好"?' chip--note':'')+'">'+esc(st)+'</span>'+
        '</div>'+
        '<dl class="ev">'+
          evRow("公告要求", esc(m.req))+
          evRow("谁要交", esc(m.who))+
          evRow("原件还是复印件", esc(m.copy))+
          evRow("什么时候交", esc(m.due)+"（剩 "+daysTo(m.due)+" 天）")+
        '</dl>'+
        '<div class="od-cluster" style="--od-gap:8px" role="group" aria-label="'+esc(m.t)+' 准备状态">'+
          STATES.map(function(s){
            return '<button class="chip'+(s===st?" chip--note":" chip--plain")+' od-touch" type="button" data-set="'+i+'" data-s="'+esc(s)+'" aria-pressed="'+(s===st)+'" style="padding:9px 14px">'+esc(s)+'</button>';
          }).join("")+
        '</div>'+
      '</div></div>';
    }).join("")+
      (readyCount===ms.length?'<div class="callout callout--ok"><div class="strong">材料已经准备齐了</div><div class="t-sm" style="color:inherit">下一步可以前往官方系统报名。提交完成后，回来记录报考状态。</div><button class="btn btn--primary btn--sm" type="button" data-ready-apply>前往官方报名</button></div>':'');
    Array.prototype.forEach.call(host.querySelectorAll("[data-set]"), function(b){
      b.addEventListener("click", function(){
        var m = ms[parseInt(b.getAttribute("data-set"),10)], s = b.getAttribute("data-s");
        requireAuth("保存材料准备进度", function(){

    if(readyApply) readyApply.addEventListener("click",function(){ applyEntry(o); });
  }
  draw();
  return n;
}

/* 2. 草稿审核：机器提取 + 人工核对 + 依据定位 */
function viewConsoleDraft(){
  setTitle("内部工作台 · 草稿审核");
  var d = CONSOLE_DATA.draft;
  var inner =
    '<div class="callout callout--ask"><div class="strong">机器提取结果只是草稿</div>'+
      '<div class="t-sm" style="color:inherit">在全部关键字段都标出原文位置并人工确认之前，这条公告不会对外显示。</div></div>'+
    '<div class="card"><div class="card__b od-stack" style="--od-gap:14px">'+
      '<div class="od-row" style="--od-gap:10px;flex-wrap:wrap">'+
        '<h2 class="t-h4 od-fill">'+esc(d.id)+' · 字段核对</h2>'+
        '<span class="chip chip--plain" data-count></span></div>'+
      '<div class="ctable--scroll"><table class="ctable"><thead><tr>'+
        '<th>字段</th><th>提取到的内容</th><th>原文位置（必填）</th><th>状态</th><th></th>'+
      '</tr></thead><tbody data-rows></tbody></table></div>'+
      '<div class="od-cluster" style="--od-gap:10px">'+
        '<button class="btn btn--primary" type="button" data-pub>发布这一版</button>'+
        '<button class="btn btn--ghost" type="button" data-back>退回修改</button>'+
        '<span class="t-xs" data-warn></span>'+
      '</div>'+
    '</div></div>';
  var n = consoleShell("草稿审核", inner, "/console/draft");
  var rows = d.fields.map(function(f){ return {f:f.f, v:f.v, loc:f.loc, key:f.key, state:f.state}; });
  var tb = n.querySelector("[data-rows]"), cnt = n.querySelector("[data-count]"), warn = n.querySelector("[data-warn]");
  function draw(){
    tb.innerHTML = rows.map(function(r,i){
      var blocked = r.key && (!r.loc || r.v==="未提取到");
      return '<tr><td class="od-nowrap"><span class="strong">'+esc(r.f)+'</span>'+(r.key?'<br><span class="t-xs">关键字段</span>':'')+'</td>'+
        '<td>'+(r.v==="未提取到"? '<span class="t-sm" style="color:var(--no-ink)">未提取到，需人工填写</span>' : esc(r.v))+'</td>'+
        '<td>'+(r.loc? esc(r.loc) : '<span class="t-sm" style="color:var(--no-ink)">缺原文位置</span>')+'</td>'+
        '<td><span class="chip'+(r.state==="已核对"?' chip--note':'')+'">'+esc(r.state)+'</span></td>'+
        '<td class="od-nowrap">'+(r.state==="已核对"
          ? '<button class="btn btn--quiet btn--sm" type="button" data-un="'+i+'">撤销核对</button>'
          : '<button class="btn btn--ghost btn--sm" type="button" data-ck="'+i+'">'+(blocked?"补全并核对":"标记已核对")+'</button>')+'</td></tr>';
    }).join("");
    var left = rows.filter(function(r){ return r.key && r.state!=="已核对"; }).length;
    cnt.textContent = left? ("还有 "+left+" 个关键字段待核对") : "全部关键字段已核对";
    warn.textContent = left? "必须核对完全部关键字段才能发布。" : "可以发布。发布后这一版不再修改。";
    Array.prototype.forEach.call(tb.querySelectorAll("[data-ck]"), function(b){
      b.addEventListener("click", function(){
        var r = rows[parseInt(b.getAttribute("data-ck"),10)];
        if(r.key && (!r.loc || r.v==="未提取到")){ fillModal(r); return; }
        r.state = "已核对"; draw();
      });
    });
    Array.prototype.forEach.call(tb.querySelectorAll("[data-un]"), function(b){
      b.addEventListener("click", function(){ rows[parseInt(b.getAttribute("data-un"),10)].state = "待核对"; draw(); });
    });
  }
  function fillModal(r){
    modal({title:"补全「"+r.f+"」",
      body:'<p class="t-sm">关键字段必须写明内容和原文位置，否则不能发布。</p>'+
        '<div class="od-stack" style="--od-gap:8px"><label class="label" for="cf-v">字段内容</label>'+
        '<input class="input" id="cf-v" value="'+esc(r.v==="未提取到"?"":r.v)+'" placeholder="例如：公告未设置年龄上限" /></div>'+
        '<div class="od-stack" style="--od-gap:8px"><label class="label" for="cf-l">原文位置</label>'+
        '<input class="input" id="cf-l" value="'+esc(r.loc||"")+'" placeholder="例如：正文「二、报考条件」第 2 项" /></div>',
      focus:"#cf-v",
      actions:[
        {label:"保存并标记已核对", primary:true, close:false, onClick:function(node){
          var v = (node.querySelector("#cf-v").value||"").trim();
          var l = (node.querySelector("#cf-l").value||"").trim();
          if(!v || !l){ toast("内容和原文位置都要填"); return; }
          r.v = v; r.loc = l; r.state = "已核对";
          closeLayer(); draw(); toast("已核对「"+r.f+"」");
        }},
        {label:"取消", onClick:function(){}}
      ]});
  }
  draw();
  n.querySelector("[data-pub]").addEventListener("click", function(){
    var left = rows.filter(function(r){ return r.key && r.state!=="已核对"; });
    if(left.length){
      modal({title:"还不能发布",
        body:'<div class="callout callout--no"><div class="strong">有 '+left.length+' 个关键字段没有核对</div>'+
          '<div class="t-sm" style="color:inherit">'+esc(left.map(function(r){return r.f;}).join("、"))+'</div>'+
          '<div class="t-sm" style="color:inherit">没有原文位置的字段不能对外显示，否则用户无法回到原文核对。</div></div>',
        actions:[{label:"回去继续核对", primary:true, onClick:function(){}}]});
      return;
    }
    navigate("#/console/publish");
  });
  n.querySelector("[data-back]").addEventListener("click", function(){
    modal({title:"退回修改",
      body:'<div class="od-stack" style="--od-gap:8px"><label class="label" for="bk">退回原因</label>'+
        '<textarea class="textarea" id="bk" rows="3" placeholder="例如：专业要求与岗位表不一致，需先向招聘单位确认。"></textarea></div>',
      focus:"#bk",
      actions:[
        {label:"退回给提交人", primary:true, onClick:function(){ toast("已退回修改（演示）"); navigate("#/console"); }},
        {label:"取消", onClick:function(){}}
      ]});
  });
  return n;
}
